<!doctype html>
<html lang="de" data-theme="system">
<head>
<meta charset="utf-8">

<style>
:root {
  --bg: #F5F6FA; --card: #FFFFFF; --card2: #F8F9FC; --text: #0F172A; --muted: #64748B; --line: #E7E9F0;
  --accent: #4F46E5; --accent-soft: #EEF0FF; --accent-ink: #FFFFFF;
  --ok: #16A34A; --warn: #D97706; --bad: #DC2626; --ok-soft: #E8F7EE; --warn-soft: #FFF4DF; --bad-soft: #FDECEC;
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  --radius: 20px; --nav-h: 68px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0B1020; --card: #141A2E; --card2: #1A2140; --text: #E8ECF8; --muted: #93A0BE; --line: #262E4D;
  --accent: #8B93FF; --accent-soft: #232A52; --accent-ink: #0B1020;
  --ok: #4ADE80; --warn: #FBBF24; --bad: #F87171; --ok-soft: #12301F; --warn-soft: #362A0E; --bad-soft: #3A1717;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] {
    --bg: #0B1020; --card: #141A2E; --card2: #1A2140; --text: #E8ECF8; --muted: #93A0BE; --line: #262E4D;
    --accent: #8B93FF; --accent-soft: #232A52; --accent-ink: #0B1020;
    --ok: #4ADE80; --warn: #FBBF24; --bad: #F87171; --ok-soft: #12301F; --warn-soft: #362A0E; --bad-soft: #3A1717;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; letter-spacing: -.01em; }
h1 { font-size: 26px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.hide { display: none !important; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 10px; }

/* Layout */
#app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 24px 16px; border-right: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; gap: 6px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; padding: 4px 10px 18px; }
.brand-logo { width: 34px; height: 34px; border-radius: 11px; background: linear-gradient(135deg, #6366F1, #22C55E); display: grid; place-items: center; color: #fff; font-size: 17px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; border: 0; background: none; color: var(--muted); font-weight: 600; text-align: left; width: 100%; transition: background .15s, color .15s; }
.nav-item:hover { background: var(--card2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-ico { width: 22px; text-align: center; font-size: 17px; }
.side .spacer { flex: 1; }
.main { padding: 28px clamp(16px, 3vw, 40px) 60px; max-width: 1180px; width: 100%; min-width: 0; margin: 0 auto; }
.grid > *, .card { min-width: 0; }
.bottom { display: none; }
@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; }
  .side { display: none; }
  .main { padding: 18px 16px calc(var(--nav-h) + 40px); }
  .bottom { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  .bottom button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); }
  .bottom button .nav-ico { font-size: 20px; }
  .bottom button.active { color: var(--accent); }

}
.page-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
.page-head .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); } .g2 { grid-template-columns: repeat(2, 1fr); }
.g-hero { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 1000px) { .g4 { grid-template-columns: repeat(2, 1fr); } .g-hero { grid-template-columns: 1fr; } .g3 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .g2, .g3 { grid-template-columns: 1fr; } .g4 { gap: 12px; } }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); animation: rise .35s ease both; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.kpi { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi .label { color: var(--muted); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kpi .value { font-size: clamp(20px, 2.4vw, 27px); font-weight: 750; letter-spacing: -.02em; overflow-wrap: anywhere; }
.kpi .sub { font-size: 12.5px; color: var(--muted); }
.pos { color: var(--ok); } .neg { color: var(--bad); } .warnc { color: var(--warn); }

/* Buttons & Formulare */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--card); padding: 10px 16px; border-radius: 12px; font-weight: 650; transition: transform .1s, box-shadow .15s, background .15s; min-height: 42px; }
.btn:hover { background: var(--card2); } .btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.income { background: var(--ok); color: #fff; border-color: transparent; } .btn.expense { background: var(--bad); color: #fff; border-color: transparent; }
:root[data-theme="dark"] .btn.income, :root[data-theme="dark"] .btn.expense { color: #0B1020; }
.btn.danger { background: var(--bad); color: #fff; border-color: transparent; } .btn.danger:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); } .btn.ghost:hover { background: var(--card2); color: var(--text); }
.btn.sm { padding: 6px 11px; min-height: 34px; font-size: 13px; border-radius: 10px; }
.btn.big { padding: 13px 22px; font-size: 16px; border-radius: 14px; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 10px; border: 0; background: transparent; color: var(--muted); font-size: 16px; }
.icon-btn:hover { background: var(--card2); color: var(--text); } .icon-btn.del:hover { background: var(--bad-soft); color: var(--bad); }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 650; color: var(--muted); min-width: 0; }
.input, select.input, textarea.input { width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-weight: 500; min-height: 44px; transition: border-color .15s, box-shadow .15s; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.input.invalid { border-color: var(--bad); }
textarea.input { min-height: 70px; resize: vertical; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .form-grid .full { grid-column: 1 / -1; }
@media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }
.seg { display: inline-flex; background: var(--card2); border: 1px solid var(--line); padding: 4px; border-radius: 13px; gap: 4px; }
.seg button { border: 0; background: none; padding: 8px 14px; border-radius: 10px; font-weight: 650; color: var(--muted); min-height: 36px; }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(15,23,42,.12); }
.check { display: flex; align-items: flex-start; gap: 10px; font-weight: 550; color: var(--text); font-size: 14px; }
.check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--accent); flex: none; }
.err { background: var(--bad-soft); color: var(--bad); padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; }
.note { background: var(--accent-soft); color: var(--text); padding: 10px 14px; border-radius: 12px; font-size: 13.5px; }
.note.warn { background: var(--warn-soft); } .note.bad { background: var(--bad-soft); } .note.ok { background: var(--ok-soft); }

/* Monatswähler */
.monthpick { display: inline-flex; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; box-shadow: var(--shadow); }
.monthpick .lab { min-width: 150px; text-align: center; font-weight: 700; text-transform: capitalize; border: 0; background: none; padding: 6px 8px; border-radius: 10px; }
.monthpick .lab:hover { background: var(--card2); }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.bad { background: var(--bad-soft); color: var(--bad); } .tag.mute { background: var(--card2); color: var(--muted); }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; }
.badge-ico { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 19px; flex: none; }

/* Fortschrittsbalken */
.bar { height: 9px; background: var(--card2); border-radius: 999px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.bar > i { display: block; height: 100%; border-radius: 999px; width: 0; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.bar.thick { height: 12px; }

/* Budgetkreis */
.ring-wrap { position: relative; width: min(100%, 440px); margin: 0 auto; aspect-ratio: 1; }
.ring-wrap svg { width: 100%; height: 100%; overflow: visible; }
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; padding: 22%; }
.ring-center .big { font-size: clamp(20px, 4.4vw, 30px); font-weight: 780; letter-spacing: -.02em; line-height: 1.1; }
.ring-center .pct { font-size: clamp(15px, 3vw, 20px); font-weight: 700; margin-top: 4px; }
.seg-path { cursor: pointer; transition: opacity .2s, filter .2s; }
.seg-fill { transition: stroke-dasharray 1s cubic-bezier(.2,.8,.2,1); }
.seg-group.dim .seg-path { opacity: .35; }
.seg-group.sel .seg-track { filter: drop-shadow(0 0 6px rgba(0,0,0,.25)); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.seg-over { animation: pulse 1.6s ease-in-out infinite; }
.legend { display: flex; flex-direction: column; margin-top: 18px; }
.legend-row { display: grid; grid-template-columns: 14px minmax(90px, 1.4fr) 1fr 1fr 1fr; gap: 10px; align-items: center; padding: 10px 8px; border-radius: 12px; border: 0; background: none; text-align: left; width: 100%; }
.legend-row:hover, .legend-row.sel { background: var(--card2); }
.legend-row.head { color: var(--muted); font-size: 12px; font-weight: 700; cursor: default; padding-bottom: 4px; } .legend-row.head:hover { background: none; }
.legend-row .r { text-align: right; }
@media (max-width: 600px) { .legend-row { grid-template-columns: 14px 1fr auto auto; } .legend-row .hb { display: none; } }
.detail { margin-top: 14px; border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: var(--card2); animation: rise .25s ease both; }

/* Listen */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); min-width: 0; }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .amount { font-weight: 720; white-space: nowrap; }
.row .acts { display: flex; gap: 2px; flex: none; }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty .em-ico { font-size: 34px; margin-bottom: 6px; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(8,12,28,.55); backdrop-filter: blur(3px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--card); border-radius: 24px; width: min(560px, 100%); max-height: calc(100dvh - 32px); overflow: auto; padding: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.35); animation: pop .25s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
.modal h2 { margin-bottom: 16px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
@media (max-width: 600px) { .overlay { align-items: flex-end; padding: 0; } .modal { border-radius: 24px 24px 0 0; max-height: 92dvh; width: 100%; } }
.stack { display: flex; flex-direction: column; gap: 14px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; box-shadow: inset 0 0 0 2px rgba(255,255,255,.55); padding: 0; transition: transform .12s; }
.swatch:hover { transform: scale(1.12); } .swatch.on { border-color: var(--text); }
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; max-height: 150px; overflow: auto; padding: 2px; }
.icon-opt { height: 42px; border-radius: 12px; border: 2px solid transparent; background: var(--card2); font-size: 20px; }
.icon-opt.on { border-color: var(--accent); background: var(--accent-soft); }
.preview { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px dashed var(--line); border-radius: 16px; }
.opt { display: flex; gap: 12px; padding: 14px; border: 2px solid var(--line); border-radius: 16px; cursor: pointer; align-items: flex-start; }
.opt.on { border-color: var(--accent); background: var(--accent-soft); } .opt.on.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt input[type=radio] { margin-top: 3px; accent-color: var(--accent); width: 18px; height: 18px; }
.toast-box { position: fixed; z-index: 200; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 20px); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
@media (min-width: 761px) { .toast-box { bottom: 28px; } }
.toast { background: #0F172A; color: #fff; padding: 11px 18px; border-radius: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.3); animation: pop .25s both; pointer-events: auto; max-width: min(92vw, 460px); }
.toast.bad { background: var(--bad); }
.fab { display: none; }
.charts text { fill: var(--muted); font-size: 11px; }
.tt { position: fixed; z-index: 150; pointer-events: none; background: #0F172A; color: #fff; padding: 8px 11px; border-radius: 10px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: 240px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 10px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-scroll { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 8px 8px; }
table.t td { padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
table.t td.r, table.t th.r { text-align: right; }
.cat-sec h2 { display: flex; align-items: center; gap: 10px; }
.cat-row { display: flex; align-items: center; gap: 14px; padding: 12px 6px; border-bottom: 1px solid var(--line); transition: background .15s; border-radius: 12px; }
.cat-row:hover { background: var(--card2); } .cat-row:last-child { border-bottom: 0; }
.cat-row .grow { flex: 1; min-width: 0; }
.cat-name { font-weight: 700; } .cat-meta { color: var(--muted); font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

</style>

<div id="app"><noscript>Für den Finanz-Tracker wird JavaScript benötigt.</noscript></div>
<script>
const LOGIC = (() => {
// ============================================================================
// logic.js – reine Datenlogik (ohne DOM). Alle Beträge sind GANZE CENT-WERTE,
// damit keine Rundungsfehler durch Kommazahlen entstehen.
// ============================================================================

// ---------- Konstanten ------------------------------------------------------
const PALETTE = [
  '#F97316', '#F59E0B', '#84CC16', '#22C55E', '#14B8A6', '#06B6D4', '#0EA5E9', '#3B82F6',
  '#6366F1', '#8B5CF6', '#A855F7', '#EC4899', '#F43F5E', '#EF4444', '#78716C', '#94A3B8',
];
const ICONS = [
  '🛒', '🍽️', '☕', '🎮', '🎬', '🛍️', '👕', '🚆', '🚗', '⛽', '🚲', '✈️', '🏖️', '🏠', '💡', '📱',
  '📺', '🎵', '📚', '🎓', '💊', '🏥', '💪', '🐶', '👶', '🎁', '🛡️', '🧾', '🔧', '📦', '💼', '🧑‍💻',
  '💶', '🏦', '📈', '↩️', '🏷️', '🌱', '🎉', '⭐',
];
const PAYMENT_METHODS = ['Karte', 'Bargeld', 'Überweisung', 'Lastschrift', 'PayPal', 'Sonstige'];
const UNCAT_COLOR = '#94A3B8';
const UNCAT_NAME = 'Ohne Kategorie';

// ---------- Datum -----------------------------------------------------------
const pad = (n) => String(n).padStart(2, '0');
function todayISO(d = new Date()) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
const monthOf = (iso) => iso.slice(0, 7);
function addMonths(month, n) {
  const [y, m] = month.split('-').map(Number);
  const t = y * 12 + (m - 1) + n;
  return `${Math.floor(t / 12)}-${pad((t % 12) + 1)}`;
}
function monthIndex(month) {
  const [y, m] = month.split('-').map(Number);
  return y * 12 + (m - 1);
}
function monthRange(from, to) {
  const out = [];
  for (let m = from; m <= to && out.length < 600; m = addMonths(m, 1)) out.push(m);
  return out;
}
function daysInMonth(month) {
  const [y, m] = month.split('-').map(Number);
  return new Date(Date.UTC(y, m, 0)).getUTCDate();
}
function isValidISODate(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d && y >= 1900 && y <= 2200;
}
const isMonthKey = (s) => typeof s === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(s);
function occurrenceDate(month, day) {
  return `${month}-${pad(Math.min(day, daysInMonth(month)))}`;
}
function fmtDate(iso) {
  if (!iso) return '';
  return `${iso.slice(8, 10)}.${iso.slice(5, 7)}.${iso.slice(0, 4)}`;
}
function monthLabel(month) {
  const [y, m] = month.split('-').map(Number);
  return new Intl.DateTimeFormat('de-DE', { month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(Date.UTC(y, m - 1, 1)));
}
function monthShort(month) {
  const [y, m] = month.split('-').map(Number);
  const s = new Intl.DateTimeFormat('de-DE', { month: 'short', timeZone: 'UTC' }).format(new Date(Date.UTC(y, m - 1, 1)));
  return `${s.replace('.', '')} ${String(y).slice(2)}`;
}

// ---------- Geld ------------------------------------------------------------
const eurFmt = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const eurFmtShort = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', minimumFractionDigits: 0, maximumFractionDigits: 0 });
const fmtEuro = (cents) => eurFmt.format(cents / 100);
/** Ohne Nachkommastellen, wenn der Betrag glatt ist (z. B. „1.500 €“). */
const fmtEuroShort = (cents) => (cents % 100 === 0 ? eurFmtShort.format(cents / 100) : eurFmt.format(cents / 100));
const fmtPct = (v, d = 0) => `${new Intl.NumberFormat('de-DE', { maximumFractionDigits: d }).format(v)} %`;
/** Wert für Eingabefelder: 1234,5 -> „1234,50“, 300 -> „300“ */
function centsToInput(cents) {
  if (cents == null) return '';
  return cents % 100 === 0 ? String(cents / 100) : (cents / 100).toFixed(2).replace('.', ',');
}
/** Deutsche Eingabe → Cent. „1.234,56“, „12,5“, „12.50“, „300 €“. Gibt null bei ungültiger Eingabe zurück. */
function parseEuro(input) {
  if (input == null) return null;
  let s = String(input).trim().replace(/[€\s]/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return null;
  const c = Math.round(parseFloat(s) * 100);
  return Number.isSafeInteger(c) && c <= 9_999_999_999 ? c : null;
}

// ---------- IDs / Zufall ----------------------------------------------------
function uid() {
  if (globalThis.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- Datenmodell & Patches ------------------------------------------
const COLLS = ['categories', 'transactions', 'rules', 'budgets', 'goals'];
const keyOf = (coll, item) => (coll === 'budgets' ? item.month : item.id);

function emptyData() {
  return {
    categories: [], transactions: [], rules: [], budgets: [], goals: [],
    settings: { theme: 'system', seeded: true, hasSample: false },
  };
}

/** Wendet einen Patch {coll:{put:[],del:[]}, settings:{}} unveränderlich an. */
function applyPatch(data, patch) {
  const next = { ...data };
  for (const coll of COLLS) {
    const p = patch[coll];
    if (!p) continue;
    let arr = data[coll];
    if (p.del && p.del.length) {
      const del = new Set(p.del);
      arr = arr.filter((x) => !del.has(keyOf(coll, x)));
    }
    if (p.put && p.put.length) {
      const idx = new Map(arr.map((x, i) => [keyOf(coll, x), i]));
      arr = arr.slice();
      for (const item of p.put) {
        const k = keyOf(coll, item);
        if (idx.has(k)) arr[idx.get(k)] = item;
        else { idx.set(k, arr.length); arr.push(item); }
      }
    }
    next[coll] = arr;
  }
  if (patch.settings) next.settings = { ...data.settings, ...patch.settings };
  return next;
}
function mergePatch(a, b) {
  const out = {};
  for (const coll of COLLS) {
    if (!a[coll] && !b[coll]) continue;
    out[coll] = {
      put: [...(a[coll]?.put || []), ...(b[coll]?.put || [])],
      del: [...(a[coll]?.del || []), ...(b[coll]?.del || [])],
    };
  }
  const settings = { ...(a.settings || {}), ...(b.settings || {}) };
  if (Object.keys(settings).length) out.settings = settings;
  return out;
}
const isEmptyPatch = (p) =>
  !p.settings && COLLS.every((c) => !p[c] || (!(p[c].put && p[c].put.length) && !(p[c].del && p[c].del.length)));

function splitCents(total, n, rnd) {
  const w = Array.from({ length: n }, () => 0.5 + rnd());
  const sum = w.reduce((a, b) => a + b, 0);
  const parts = w.map((x) => Math.floor((x / sum) * total));
  parts[0] += total - parts.reduce((a, b) => a + b, 0);
  return parts;
}

/** Beispieldaten – alles ist mit sample:true gekennzeichnet und lässt sich komplett löschen. */
function buildSeed(today) {
  const cur = monthOf(today);
  const dayNow = Number(today.slice(8, 10));
  const rnd = mulberry32(20260);
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const between = (a, b) => Math.round(a + rnd() * (b - a));
  const data = emptyData();
  data.settings.hasSample = true;
  data.categories = defaultCategories(false);
  const txs = [];
  const mk = (type, title, cents, date, categoryId, extra = {}) =>
    txs.push({ id: uid(), type, title, amountCents: cents, date, categoryId, description: '', paymentMethod: type === 'expense' ? pick(['Karte', 'Karte', 'Bargeld', 'PayPal']) : '', sample: true, ...extra });

  const rule = (type, title, cents, categoryId, day, payment = '') => ({
    id: uid(), type, title, amountCents: cents, categoryId, description: '', paymentMethod: payment,
    day, startMonth: start, endMonth: null, skipped: [], sample: true,
  });
  data.rules = [
    rule('income', 'Gehalt', 245000, 'inc-gehalt', 1),
    rule('expense', 'Miete', 78000, 'exp-wohnen', 1, 'Überweisung'),
    rule('expense', 'Streaming-Abo', 1299, 'exp-abos', 12, 'Lastschrift'),

    rule('expense', 'Haftpflichtversicherung', 950, 'exp-versicherungen', 15, 'Lastschrift'),
  ];
  const titles = {
    'exp-lebensmittel': ['REWE', 'Edeka', 'Lidl', 'Aldi', 'Bäckerei', 'Wochenmarkt'],
    'exp-freizeit': ['Kino', 'Konzertkarten', 'Bowling', 'Escape Room'],
    'exp-mobilitaet': ['Bahnticket', 'Taxi', 'Carsharing', 'Fahrradreparatur'],
    'exp-shopping': ['Kleidung', 'Schuhe', 'Elektronik-Zubehör', 'Geschenk'],
    'exp-restaurants': ['Pizzeria', 'Sushi', 'Café', 'Burger'],
    'exp-sonstiges': ['Drogerie', 'Post & Versand', 'Haushaltswaren', 'Spende'],
    'exp-gesundheit': ['Apotheke', 'Zahnarzt Zuzahlung'],
    'exp-tanken': ['Tankstelle'],
    'exp-reisen': ['Zugtickets', 'Hotel', 'Ferienwohnung'],
  };
  const dayFor = (month, isCur) => (isCur ? 1 + Math.floor(rnd() * Math.max(1, dayNow)) : 1 + Math.floor(rnd() * daysInMonth(month)));
  for (let k = -5; k <= -1; k++) {
    const m = addMonths(cur, k);
    const plan = [
      ['exp-lebensmittel', between(24000, 33000), 8], ['exp-freizeit', between(9000, 17000), 3],
      ['exp-mobilitaet', between(4000, 9500), 3], ['exp-shopping', between(8000, 19000), 3],
      ['exp-restaurants', between(6000, 12000), 3], ['exp-sonstiges', between(6000, 22000), 2],
    ];
    if (k === -3) plan.push(['exp-reisen', 24000, 2]);
    if (k === -1) plan.push(['exp-reisen', 9000, 1]);
    if (k === -4 || k === -2) plan.push(['exp-gesundheit', between(1500, 4000), 1]);
    if (k % 2 === 0) plan.push(['exp-tanken', between(4500, 7000), 1]);
    for (const [cat, total, n] of plan) {
      splitCents(total, n, rnd).forEach((c) => mk('expense', pick(titles[cat]), c, `${m}-${pad(dayFor(m, false))}`, cat));
    }
    if (k !== -3) mk('income', 'Nebenjob', between(18000, 32000), `${m}-${pad(between(10, 25))}`, 'inc-nebenjob');
    if (k === -2) mk('income', 'Rückerstattung Online-Shop', 3490, `${m}-${pad(between(5, 20))}`, 'inc-erstattung');
  }
  // Aktueller Monat – bewusst so gewählt, dass der Budgetkreis alle Zustände zeigt
  const cd = () => `${cur}-${pad(1 + Math.floor(rnd() * Math.max(1, dayNow)))}`;
  [[5240, 'REWE'], [4785, 'Edeka'], [4975, 'Lidl']].forEach(([c, t]) => mk('expense', t, c, cd(), 'exp-lebensmittel'));
  [[7000, 'Konzertkarten'], [5000, 'Kino']].forEach(([c, t]) => mk('expense', t, c, cd(), 'exp-freizeit'));

  data.transactions = txs;

    { id: uid(), name: 'Kamera', targetCents: 80000, savedCents: 32000, targetDate: `${addMonths(cur, 5)}-30`, color: '#EC4899', description: '', sample: true },

}

  data.settings.hasSample && (data.transactions.some((t) => t.sample) || data.rules.some((r) => r.sample) || data.goals.some((g) => g.sample) || data.budgets.some((b) => b.sample));

// ---------- Budgets ---------------------------------------------------------
function defaultBudgetItems(data) {
  const items = {};
  for (const c of data.categories) if (c.type === 'expense' && c.defaultBudgetCents > 0) items[c.id] = c.defaultBudgetCents;
  return items;
}
/** Budget je Ausgabenkategorie für einen Monat. Jede Kategorie kommt genau EINMAL vor → keine Doppelzählung. */
function effectiveBudgets(data, month, today) {
  const rec = data.budgets.find((b) => b.month === month);
  const out = {};
  const valid = new Set(data.categories.filter((c) => c.type === 'expense').map((c) => c.id));
  if (rec) {
    for (const [id, v] of Object.entries(rec.items)) if (valid.has(id) && v > 0) out[id] = v;
    return out;
  }
  if (month >= monthOf(today)) return defaultBudgetItems(data); // Planung für zukünftige Monate
  return out;
}
function budgetStatus(spent, budget) {
  if (spent > budget) return 'over';
  if (spent === budget) return 'full';
  if (spent * 100 >= budget * 80) return 'warn';
  return 'ok';
}
const txOfMonth = (data, month) => data.transactions.filter((t) => t.date.startsWith(month));
const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);

function budgetStats(data, month, today) {
  const eff = effectiveBudgets(data, month, today);
  const exp = txOfMonth(data, month).filter((t) => t.type === 'expense');
  const catIds = new Set(data.categories.map((c) => c.id));
  const spentBy = new Map();
  for (const t of exp) {
    const k = t.categoryId && catIds.has(t.categoryId) ? t.categoryId : '';
    spentBy.set(k, (spentBy.get(k) || 0) + t.amountCents);
  }
  const rows = [];
  const others = [];
  for (const c of data.categories) {
    if (c.type !== 'expense') continue;
    const spent = spentBy.get(c.id) || 0;
    if (eff[c.id]) {
      const budget = eff[c.id];
      rows.push({ cat: c, budget, spent, pct: (spent / budget) * 100, remaining: budget - spent, status: budgetStatus(spent, budget) });
    } else if (spent > 0) {
      others.push({ cat: c, spent });
    }
  }
  if (spentBy.get('')) others.push({ cat: { id: '', name: UNCAT_NAME, color: UNCAT_COLOR, icon: '', type: 'expense' }, spent: spentBy.get('') });
  const total = sum(rows, (r) => r.budget);
  const spent = sum(rows, (r) => r.spent);
  return { rows, others, total, spent, pct: total > 0 ? (spent / total) * 100 : null, available: total - spent, unbudgeted: sum(others, (o) => o.spent) };
}

function monthSummary(data, month, today) {
  const tx = txOfMonth(data, month);
  const income = sum(tx.filter((t) => t.type === 'income'), (t) => t.amountCents);
  const expense = sum(tx.filter((t) => t.type === 'expense'), (t) => t.amountCents);
  const planned = sum(tx.filter((t) => t.type === 'expense' && t.date > today), (t) => t.amountCents);
  const b = budgetStats(data, month, today);
  return {
    income, expense, balance: income - expense, plannedExpense: planned,
    savingsRate: income > 0 ? ((income - expense) / income) * 100 : null,
    budget: b, budgetTotal: b.total, budgetSpent: b.spent, budgetPct: b.pct, budgetAvailable: b.available,
  };
}

/** Legt für den aktuellen Monat (und evtl. übersprungene Monate) feste Budgets an,
 *  damit spätere Änderungen an Standardbudgets vergangene Monate nicht verändern. */
function ensureBudgetRecordsPatch(data, today) {
  const cur = monthOf(today);
  const have = new Set(data.budgets.map((b) => b.month));
  const past = [...have].filter((m) => m <= cur).sort();
  let start = past.length ? addMonths(past[past.length - 1], 1) : cur;
  const floor = addMonths(cur, -24);
  if (start < floor) start = floor;
  const put = [];
  for (const m of monthRange(start, cur)) if (!have.has(m)) put.push({ month: m, items: defaultBudgetItems(data), sample: false });
  return put.length ? { budgets: { put } } : {};
}
function setBudgetPatch(data, month, catId, cents, today) {
  const rec = data.budgets.find((b) => b.month === month);
  const items = { ...(rec ? rec.items : effectiveBudgets(data, month, today)) };
  if (cents > 0) items[catId] = cents; else delete items[catId];
  return { budgets: { put: [{ month, items, sample: false }] } };
}
function copyBudgetsPatch(data, fromMonth, toMonth, today) {
  return { budgets: { put: [{ month: toMonth, items: { ...effectiveBudgets(data, fromMonth, today) }, sample: false }] } };
}
function resetBudgetsPatch(data, month) {
  return { budgets: { put: [{ month, items: defaultBudgetItems(data), sample: false }] } };
}

// ---------- Kategorien ------------------------------------------------------
function saveCategory(data, form, today) {
  const name = String(form.name || '').trim().replace(/\s+/g, ' ');
  if (!name) return { error: 'Bitte einen Namen eingeben.' };
  if (name.length > 30) return { error: 'Der Name darf höchstens 30 Zeichen lang sein.' };
  if (!['income', 'expense'].includes(form.type)) return { error: 'Bitte Einnahme oder Ausgabe wählen.' };
  if (!/^#[0-9a-f]{6}$/i.test(form.color || '')) return { error: 'Bitte eine gültige Farbe wählen.' };
  const dup = data.categories.find((c) => c.type === form.type && c.id !== form.id && c.name.toLowerCase() === name.toLowerCase());
  if (dup) return { error: `Es gibt bereits eine ${form.type === 'income' ? 'Einnahmen' : 'Ausgaben'}kategorie „${dup.name}“.` };
  const existing = form.id ? data.categories.find((c) => c.id === form.id) : null;
  if (existing && existing.type !== form.type) return { error: 'Die Art einer bestehenden Kategorie kann nicht geändert werden.' };
  let budget = null;
  if (form.type === 'expense' && form.budgetCents) {
    if (!(form.budgetCents > 0)) return { error: 'Das Budget muss größer als 0 € sein – oder leer bleiben.' };
    budget = form.budgetCents;
  }
  const cat = {
    id: existing ? existing.id : uid(), name, type: form.type, color: form.color.toUpperCase(), icon: form.icon || '',
    defaultBudgetCents: budget, sample: false,
  };
  const patch = { categories: { put: [cat] } };
  if (cat.type === 'expense' && (!existing || existing.defaultBudgetCents !== budget)) {
    // Standardbudget gilt ab dem aktuellen Monat; vergangene Monate bleiben unverändert.
    const cur = monthOf(today);
    const put = data.budgets.filter((b) => b.month >= cur).map((b) => {
      const items = { ...b.items };
      if (budget) items[cat.id] = budget; else delete items[cat.id];
      return { ...b, items, sample: false };
    });
    if (put.length) patch.budgets = { put };
  }
  return { patch, category: cat };
}

function categoryUsage(data, id) {
  return {
    transactions: data.transactions.filter((t) => t.categoryId === id).length,
    rules: data.rules.filter((r) => r.categoryId === id).length,
    budgetMonths: data.budgets.filter((b) => b.items[id] > 0).length,
  };
}

/** mode: 'reassign' (targetId nötig) | 'uncategorized' | 'cascade' (löscht auch Transaktionen!) */
function deleteCategory(data, id, mode, targetId) {
  const cat = data.categories.find((c) => c.id === id);
  if (!cat) return { error: 'Kategorie nicht gefunden.' };
  const txs = data.transactions.filter((t) => t.categoryId === id);
  const rules = data.rules.filter((r) => r.categoryId === id);
  const patch = { categories: { del: [id] } };
  if (mode === 'reassign') {
    const target = data.categories.find((c) => c.id === targetId);
    if (!target || target.id === id || target.type !== cat.type) return { error: 'Bitte eine passende andere Kategorie auswählen.' };
    patch.transactions = { put: txs.map((t) => ({ ...t, categoryId: targetId })) };
    patch.rules = { put: rules.map((r) => ({ ...r, categoryId: targetId })) };
  } else if (mode === 'uncategorized') {
    patch.transactions = { put: txs.map((t) => ({ ...t, categoryId: null })) };
    patch.rules = { put: rules.map((r) => ({ ...r, categoryId: null })) };
  } else if (mode === 'cascade') {
    patch.transactions = { del: txs.map((t) => t.id) };
    patch.rules = { del: rules.map((r) => r.id) };
  } else {
    return { error: 'Unbekannte Löschart.' };
  }
  const bPut = [];
  for (const b of data.budgets) {
    if (b.items[id] === undefined) continue;
    const items = { ...b.items };
    const v = items[id];
    delete items[id];
    if (mode === 'reassign' && v > 0) items[targetId] = (items[targetId] || 0) + v; // Summe bleibt erhalten
    bPut.push({ ...b, items });
  }
  if (bPut.length) patch.budgets = { put: bPut };
  return { patch };
}

// ---------- Wiederkehrende Transaktionen -----------------------------------
/** Erzeugt fehlende Monatsbuchungen für alle Serien (bis 12 Monate voraus). Idempotent. */
function ensureRecurringPatch(data, today) {
  const horizon = addMonths(monthOf(today), 12);
  const have = new Set(data.transactions.filter((t) => t.ruleId).map((t) => `${t.ruleId}:${monthOf(t.date)}`));
  const put = [];
  for (const r of data.rules) {
    const last = r.endMonth && r.endMonth < horizon ? r.endMonth : horizon;
    for (const m of monthRange(r.startMonth, last)) {
      if (r.skipped.includes(m) || have.has(`${r.id}:${m}`)) continue;
      have.add(`${r.id}:${m}`);
      put.push({
        id: uid(), type: r.type, title: r.title, amountCents: r.amountCents, date: occurrenceDate(m, r.day),
        categoryId: r.categoryId, description: r.description || '', paymentMethod: r.paymentMethod || '', ruleId: r.id, sample: !!r.sample,
      });
    }
  }
  return put.length ? { transactions: { put } } : {};
}

function validateTx(data, form) {
  const title = String(form.title || '').trim();
  if (!title) return { error: 'Bitte eine Bezeichnung eingeben.' };
  if (title.length > 120) return { error: 'Die Bezeichnung darf höchstens 120 Zeichen lang sein.' };
  if (!['income', 'expense'].includes(form.type)) return { error: 'Bitte Einnahme oder Ausgabe wählen.' };
  if (!(Number.isInteger(form.amountCents) && form.amountCents > 0)) return { error: 'Bitte einen Betrag größer als 0 eingeben, z. B. 12,50.' };
  if (!isValidISODate(form.date)) return { error: 'Bitte ein gültiges Datum angeben.' };

  const m = {
    name: editing ? editing.name : '', type: editing ? editing.type : init.type || 'expense',

        field('Farbe', swatchPicker(L.PALETTE, m.color, (c) => { m.color = c; drawPreview(); })),

/** Sicherer Löschdialog: Standard ist NIE das Löschen von Transaktionen. */
function deleteCategoryDialog(cat) {
  const txs = S.data.transactions.filter((t) => t.categoryId === cat.id);
  const rules = S.data.rules.filter((r) => r.categoryId === cat.id);
  if (!txs.length && !rules.length) {
    confirmDialog({ title: 'Kategorie löschen?', text: `„${cat.name}“ ist keiner Buchung zugeordnet und wird entfernt.${L.categoryUsage(S.data, cat.id).budgetMonths ? ' Zugehörige Budgetwerte werden ebenfalls entfernt.' : ''}`, confirmLabel: 'Löschen' })
      .then(async (ok) => { if (ok) { const r = L.deleteCategory(S.data, cat.id, 'uncategorized'); await commit(r.patch, 'Kategorie gelöscht.'); } });
    return;
  }
  const others = catsOf(cat.type).filter((c) => c.id !== cat.id);
  const total = txs.reduce((a, t) => a + t.amountCents, 0);
  const dates = txs.map((t) => t.date).sort();
  const m = { mode: others.length ? 'reassign' : 'uncategorized', target: others[0] ? others[0].id : '', confirmText: '', ack: false };

    const body = h('div', { class: 'stack' }); const errBox = h('div');
    const draw = () => {
      clear(body);
      const opt = (mode, title, text, content, bad) => h('label', { class: 'opt' + (m.mode === mode ? ' on' : '') + (bad && m.mode === mode ? ' bad' : '') },
        h('input', { type: 'radio', name: 'mode', checked: m.mode === mode, disabled: mode === 'reassign' && !others.length, onChange: () => { m.mode = mode; draw(); } }),
        h('div', { style: { flex: 1, minWidth: 0 } }, h('div', { style: { fontWeight: 700 } }, title), h('div', { class: 'small muted' }, text), m.mode === mode ? content : null));
      body.append(
        h('div', { class: 'note warn' }, h('b', null, `„${cat.name}“ enthält ${txs.length} Buchung${txs.length === 1 ? '' : 'en'}`), ` (zusammen ${L.fmtEuro(total)}${dates.length ? `, ${L.fmtDate(dates[0])} bis ${L.fmtDate(dates[dates.length - 1])}` : ''})${rules.length ? ` und ${rules.length} Dauerauftrag/-aufträge` : ''}. Was soll damit passieren?`),
        opt('reassign', 'Einer anderen Kategorie zuordnen (empfohlen)', others.length ? 'Alle Buchungen und Budgets wandern in die gewählte Kategorie. Es geht nichts verloren.' : 'Keine andere Kategorie dieser Art vorhanden – lege zuerst eine an.',
          others.length ? h('select', { class: 'input', style: { marginTop: '10px' }, 'aria-label': 'Zielkategorie', onChange: (e) => { m.target = e.target.value; } }, others.map((c) => h('option', { value: c.id, selected: c.id === m.target }, `${c.icon ? c.icon + ' ' : ''}${c.name}`))) : null),
        opt('uncategorized', 'Ohne Kategorie weiterführen', 'Die Buchungen bleiben erhalten und erscheinen als „Ohne Kategorie“. Summen und Monatsauswertungen bleiben gleich.'),
        opt('cascade', 'Kategorie samt Buchungen löschen', 'Alle zugehörigen Buchungen werden unwiderruflich gelöscht. Historische Monatssummen ändern sich dadurch.',
          h('div', { class: 'stack', style: { marginTop: '10px' } },
            h('div', { class: 'small' }, `Es werden ${txs.length} Buchung${txs.length === 1 ? '' : 'en'} (${L.fmtEuro(total)}) gelöscht. `, h('button', { type: 'button', class: 'btn sm', onClick: (e) => { e.preventDefault(); downloadBackup(); } }, '⬇ Vorher Backup laden')),
            h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: m.ack, onChange: (e) => { m.ack = e.target.checked; sync(); } }), h('span', null, 'Ich weiß, dass diese Buchungen danach weg sind.')),
            field('Zur Bestätigung „LÖSCHEN“ eingeben', h('input', { class: 'input', value: m.confirmText, autocomplete: 'off', onInput: (e) => { m.confirmText = e.target.value; sync(); } }))), true));

function downloadFile(name, content, type) {
  const blob = new Blob([content], { type: type + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

  if (scopeMonth) list = list.filter((t) => t.date.startsWith(scopeMonth));
  if (f.cat) list = list.filter((t) => (f.cat === '__none' ? !t.categoryId : t.categoryId === f.cat));
  if (f.from) list = list.filter((t) => t.date >= f.from);

  const sorters = { 'date-desc': byDateDesc, 'date-asc': (a, b) => -byDateDesc(a, b), 'amt-desc': (a, b) => b.amountCents - a.amountCents, 'amt-asc': (a, b) => a.amountCents - b.amountCents };
  list = [...list].sort(sorters[f.sort] || byDateDesc);
  const inc = list.filter((t) => t.type === 'income').reduce((a, t) => a + t.amountCents, 0), exp = list.filter((t) => t.type === 'expense').reduce((a, t) => a + t.amountCents, 0);

  // Balken animieren (Breite nach dem ersten Layout setzen)
  requestAnimationFrame(() => requestAnimationFrame(() => r.querySelectorAll('i[data-w]').forEach((el) => { el.style.width = el.dataset.w + '%'; })));
  window.scrollTo(0, scrollY);
}

// ---------- Start ------------------------------------------------------------
/** Schnellaktionen der installierten App (Rechtsklick/Langdruck aufs Icon): #new-expense / #new-income */
function openShortcut(hash) {
  if (hash !== 'new-expense' && hash !== 'new-income') return false;
  try { history.replaceState(null, '', '#' + S.page); } catch { /* ignorieren */ }
  txDialog({ type: hash === 'new-income' ? 'income' : 'expense' });
  return true;
}
async function boot() {
  const hash = location.hash.replace('#', '');
  if (NAV.some((n) => n[0] === hash)) S.page = hash;
  S.today = L.todayISO(); S.month = L.monthOf(S.today);
  try {
    S.db = await openDb();
    const loaded = await loadAll(S.db);
    if (loaded) S.data = loaded;
    else { S.data = L.buildSeed(S.today); S.data.settings.theme = 'system'; await writeAll(S.db, S.data); }
    for (const k of ['lastBackupAt', 'lastSnapshotDay']) S.meta[k] = await getMeta(S.db, k);
    S.folder = await getFolder(S.db);
    if (S.folder) S.folderPerm = await folderPermission(S.folder, false);
  } catch (e) {
    S.memoryOnly = true; S.db = null; S.data = L.buildSeed(S.today);
  }
  await housekeeping(); applyTheme(); render();
  if (S.folder && S.folderPerm === 'granted') scheduleFolderBackup();
  refreshStorage(false);
  if (S.page === 'settings') loadSettingsData();
  openShortcut(hash);
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installPrompt = e; if (settingsVisible()) render(); });
  window.addEventListener('appinstalled', () => { S.installPrompt = null; toast('App installiert. Du findest sie jetzt wie jedes andere Programm.'); if (settingsVisible()) render(); });
  if (channel) channel.onmessage = async () => { if (!S.db) return; try { const d = await loadAll(S.db); if (d) { S.data = d; render(); } } catch { /* ignore */ } };
  document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && L.todayISO() !== S.today) { await housekeeping(); render(); } });
  window.addEventListener('hashchange', () => { const p = location.hash.replace('#', ''); if (openShortcut(p)) return; if (NAV.some((n) => n[0] === p) && p !== S.page) { S.page = p; render(); } });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}

return { boot };
})();
APP.boot();

</script>
